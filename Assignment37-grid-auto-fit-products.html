
<!DOCTYPE html>
<html>
<head>
    <title>Grid Auto Fit Products</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 30px auto;
        }

        .card {
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .card h3 {
            color: #333;
        }

        .price {
            color: green;
            font-weight: bold;
            font-size: 18px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <h1>Our Products</h1>

    <div class="products">

        <div class="card">
            <img src="https://picsum.photos/300/200?random=1" alt="Headphones">
            <h3>Headphones</h3>
            <p class="price">₹999</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?random=2" alt="Smart Watch">
            <h3>Smart Watch</h3>
            <p class="price">₹1,499</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?random=3" alt="Shoes">
            <h3>Shoes</h3>
            <p class="price">₹1,999</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?random=4" alt="Bag">
            <h3>Travel Bag</h3>
            <p class="price">₹899</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?random=5" alt="Camera">
            <h3>Camera</h3>
            <p class="price">₹5,999</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?random=6" alt="Laptop">
            <h3>Laptop</h3>
            <p class="price">₹45,999</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
