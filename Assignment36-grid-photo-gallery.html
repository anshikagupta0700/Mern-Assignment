
<!DOCTYPE html>
<html>
<head>
    <title>Grid Photo Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 1000px;
            margin: auto;
        }

        .gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
        }

        .gallery img:hover {
            transform: scale(1.05);
            transition: 0.3s;
        }

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">

        <img src="https://picsum.photos/id/1015/400/300" alt="Nature">
        <img src="https://picsum.photos/id/1016/400/300" alt="Mountain">
        <img src="https://picsum.photos/id/1018/400/300" alt="Forest">
        <img src="https://picsum.photos/id/1020/400/300" alt="Animal">
        <img src="https://picsum.photos/id/1024/400/300" alt="Dog">
        <img src="https://picsum.photos/id/1035/400/300" alt="River">
        <img src="https://picsum.photos/id/1039/400/300" alt="Beach">
        <img src="https://picsum.photos/id/1040/400/300" alt="Waterfall">
        <img src="https://picsum.photos/id/1043/400/300" alt="Nature">

    </div>

</body>
</html>
