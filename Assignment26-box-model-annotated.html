
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f5fa;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #243b55;
        }

        .box {
            /* Margin: Space outside the border */
            margin: 40px auto;

            /* Border: Line around the padding */
            border: 5px solid #243b55;

            /* Padding: Space inside the border */
            padding: 30px;

            /* Content: Actual text area */
            width: 250px;
            background-color: #d8ecff;

            color: #222;
        }

        .content {
            background-color: #ffd166;
            padding: 20px;
        }

        .description {
            background-color: white;
            padding: 20px;
            margin: 20px auto;
            max-width: 500px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>CSS Box Model</h1>
    <p>Understanding Content, Padding, Border and Margin</p>

    <div class="box">
        <div class="content">
            Content Area
        </div>
    </div>

    <div class="description">
        <h2>Box Model Properties</h2>

        <p><b>1. Content:</b> Actual text or image inside an element.</p>

        <p><b>2. Padding:</b> Space between content and border.</p>

        <p><b>3. Border:</b> A line surrounding the padding and content.</p>

        <p><b>4. Margin:</b> Space outside the border.</p>
    </div>

</body>
</html>
