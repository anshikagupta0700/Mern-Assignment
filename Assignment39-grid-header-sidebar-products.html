
<!DOCTYPE html>
<html>
<head>
    <title>Grid Header Sidebar Products</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }

        .container {
            display: grid;

            grid-template-columns: 220px 1fr;

            grid-template-rows: 70px 1fr 50px;

            grid-template-areas:
                "header header"
                "sidebar products"
                "footer footer";

            min-height: 100vh;
            gap: 15px;
            padding: 15px;
        }

        /* Header */
        .header {
            grid-area: header;
            background-color: #2563eb;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            border-radius: 8px;
        }

        .header h2 {
            margin: 0;
        }

        .header nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        /* Sidebar */
        .sidebar {
            grid-area: sidebar;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar li {
            padding: 12px;
            margin-bottom: 10px;
            background-color: #e5e7eb;
            border-radius: 5px;
        }

        /* Products */
        .products {
            grid-area: products;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            align-content: start;
        }

        .card {
            background-color: white;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 5px;
        }

        .card h3 {
            color: #333;
        }

        .price {
            color: green;
            font-weight: bold;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        /* Footer */
        .footer {
            grid-area: footer;
            background-color: #1e293b;
            color: white;
            text-align: center;
            padding: 15px;
            border-radius: 8px;
        }

        /* Responsive */
        @media (max-width: 650px) {
            .container {
                grid-template-columns: 1fr;

                grid-template-areas:
                    "header"
                    "sidebar"
                    "products"
                    "footer";
            }

            .header {
                flex-direction: column;
                gap: 10px;
                padding: 15px;
            }

            .header nav a {
                margin: 5px;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <header class="header">

            <h2>MyShop</h2>

            <nav>
                <a href="#">Home</a>
                <a href="#">Products</a>
                <a href="#">Contact</a>
            </nav>

        </header>

        <aside class="sidebar">

            <h3>Categories</h3>

            <ul>
                <li>Electronics</li>
                <li>Clothing</li>
                <li>Shoes</li>
                <li>Accessories</li>
                <li>Books</li>
            </ul>

        </aside>

        <main class="products">

            <div class="card">
                <img src="https://picsum.photos/300/200?random=11" alt="Headphones">
                <h3>Headphones</h3>
                <p class="price">₹999</p>
                <button>Buy Now</button>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?random=12" alt="Smart Watch">
                <h3>Smart Watch</h3>
                <p class="price">₹1,499</p>
                <button>Buy Now</button>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?random=13" alt="Shoes">
                <h3>Shoes</h3>
                <p class="price">₹1,999</p>
                <button>Buy Now</button>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?random=14" alt="Bag">
                <h3>Travel Bag</h3>
                <p class="price">₹899</p>
                <button>Buy Now</button>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?random=15" alt="Camera">
                <h3>Camera</h3>
                <p class="price">₹5,999</p>
                <button>Buy Now</button>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?random=16" alt="Laptop">
                <h3>Laptop</h3>
                <p class="price">₹45,999</p>
                <button>Buy Now</button>
            </div>

        </main>

        <footer class="footer">
            © 2026 MyShop. All Rights Reserved.
        </footer>

    </div>

</body>
</html>
