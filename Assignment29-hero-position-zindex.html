
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Position and Z-Index</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f5fa;
        }

        /* Navigation Bar */
        nav {
            background-color: #243b55;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        /* Hero Section */
        .hero {
            position: relative;
            background-color: #dce9f7;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            padding: 20px;
        }

        .hero h1 {
            font-size: 40px;
            color: #243b55;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            color: #444;
        }

        .hero button {
            background-color: #243b55;
            color: white;
            border: none;
            padding: 12px 25px;
            margin-top: 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Decorative Circle */
        .circle {
            position: absolute;
            width: 220px;
            height: 220px;
            background-color: #a8c8e8;
            border-radius: 50%;
            top: 30px;
            right: 10%;
            z-index: 1;
        }

        /* Another Circle */
        .circle-two {
            position: absolute;
            width: 150px;
            height: 150px;
            background-color: #f4c987;
            border-radius: 50%;
            bottom: 20px;
            left: 10%;
            z-index: 0;
        }

        /* Information Section */
        .info {
            text-align: center;
            padding: 40px 20px;
        }

        .info h2 {
            color: #243b55;
            margin-bottom: 15px;
        }

        footer {
            background-color: #243b55;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <section class="hero">

        <div class="circle"></div>
        <div class="circle-two"></div>

        <div class="hero-content">
            <h1>Welcome to My Website</h1>

            <p>Learn HTML and CSS with creative web designs.</p>

            <button>Get Started</button>
        </div>

    </section>

    <section class="info">
        <h2>About Our Website</h2>
        <p>This website demonstrates CSS positioning and z-index.</p>
    </section>

    <footer>
        <p>Created using HTML and CSS | 2026</p>
    </footer>

</body>
</html>
