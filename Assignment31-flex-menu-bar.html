
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Menu Bar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f5fa;
        }

        /* Navigation Bar */
        .navbar {
            background-color: #243b55;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Website Logo */
        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        /* Menu Items */
        .menu {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        .menu a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .menu a:hover {
            color: #ffd166;
        }

        /* Main Section */
        .content {
            text-align: center;
            padding: 100px 20px;
        }

        .content h1 {
            color: #243b55;
            margin-bottom: 15px;
        }

        .content p {
            color: #555;
            font-size: 18px;
        }

        .btn {
            display: inline-block;
            background-color: #243b55;
            color: white;
            padding: 12px 25px;
            margin-top: 20px;
            text-decoration: none;
            border-radius: 6px;
        }

        .btn:hover {
            background-color: #456b91;
        }

        footer {
            background-color: #243b55;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .navbar {
                flex-direction: column;
                gap: 20px;
            }

            .menu {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="logo">MyWebsite</div>

        <ul class="menu">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Portfolio</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

    </nav>

    <!-- Main Content -->
    <section class="content">

        <h1>Welcome to My Website</h1>

        <p>This website demonstrates CSS Flexbox Menu Bar.</p>

        <a href="#" class="btn">Explore More</a>

    </section>

    <!-- Footer -->
    <footer>
        <p>Created using HTML and CSS | 2026</p>
    </footer>

</body>
</html>
