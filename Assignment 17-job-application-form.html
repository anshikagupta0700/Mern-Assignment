
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
</head>
<body>

    <h1>Job Application Form</h1>
    <p>Please fill out the form to apply for the job.</p>

    <form>

        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>
        <br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone" placeholder="Enter phone number">
        <br><br>

        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob">
        <br><br>

        <label for="position">Job Position:</label><br>
        <select id="position" name="position">
            <option value="">Select Position</option>
            <option>Web Developer</option>
            <option>Data Analyst</option>
            <option>Software Engineer</option>
            <option>UI/UX Designer</option>
        </select>
        <br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Other"> Other
        <br><br>

        <label for="experience">Work Experience:</label><br>
        <select id="experience" name="experience">
            <option>Fresher</option>
            <option>1-2 Years</option>
            <option>3-5 Years</option>
            <option>5+ Years</option>
        </select>
        <br><br>

        <label for="resume">Upload Resume:</label><br>
        <input type="file" id="resume" name="resume">
        <br><br>

        <label for="address">Address:</label><br>
        <textarea id="address" name="address" rows="4" cols="30" placeholder="Enter your address"></textarea>
        <br><br>

        <input type="checkbox" id="terms" required>
        <label for="terms">I agree to the terms and conditions.</label>
        <br><br>

        <button type="submit">Submit Application</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
